    <script>
      (function() {
        try {
          var stored = localStorage.getItem('nithinkrishnaah_theme');
          var isDark = stored ? stored === 'dark' : (window.matchMedia ? !window.matchMedia('(prefers-color-scheme: light)').matches : true);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
